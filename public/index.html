<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Make me a billionaire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,500;0,700;1,500&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ======================================================
   НАСТРОЙКИ — меняются только в объекте CONFIG ниже (в <script>)
   ====================================================== */
:root{
  --paper:#E9EEE3; --paper-2:#DCE4D4; --ink:#1B2A22; --ink-soft:#4A5D51;
  --engrave:#1F4D3A; --seal:#A87A2C; --line:#B9C7B4; --field:#F6F8F2;
  --serif:"EB Garamond", Georgia, "Times New Roman", serif;
  --sans:"Manrope", system-ui, -apple-system, "Segoe UI", "Noto Sans", sans-serif;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F1C16; --paper-2:#152720; --ink:#E4EBDF; --ink-soft:#9DB2A3;
    --engrave:#8FC4A6; --seal:#D4A657; --line:#2B4337; --field:#18291F;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0F1C16; --paper-2:#152720; --ink:#E4EBDF; --ink-soft:#9DB2A3;
  --engrave:#8FC4A6; --seal:#D4A657; --line:#2B4337; --field:#18291F;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:2px solid var(--seal);outline-offset:3px;border-radius:4px}
.wrap{max-width:760px;margin:0 auto;padding:20px 20px 64px}

/* top bar */
.top{display:flex;justify-content:flex-end;align-items:center;gap:8px}
.top label{font-size:14px;color:var(--ink-soft)}
select{font:inherit;font-size:14px;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:8px;padding:6px 10px}

/* hero */
h1{font-family:var(--serif);font-weight:700;font-size:clamp(44px,10vw,96px);line-height:.95;letter-spacing:-.02em;margin:40px 0 18px;color:var(--engrave)}
.sub{font-size:18px;max-width:34em;color:var(--ink-soft);margin:0 0 20px}
.story{font-family:var(--serif);font-style:italic;font-size:22px;line-height:1.45;max-width:30em;margin:0 0 40px;padding-inline-start:18px;border-inline-start:3px solid var(--seal)}

/* the cheque */
.cheque{position:relative;background:var(--paper-2);border:1px solid var(--line);border-radius:6px;padding:28px 28px 24px;
  background-image:
    repeating-radial-gradient(circle at 100% 0, transparent 0 9px, color-mix(in srgb,var(--engrave) 7%,transparent) 9px 10px),
    repeating-linear-gradient(115deg, transparent 0 14px, color-mix(in srgb,var(--engrave) 5%,transparent) 14px 15px);
  box-shadow: inset 0 0 0 6px var(--paper-2), inset 0 0 0 7px var(--line);}
.cheque-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:22px}
.bankname{font-family:var(--serif);font-style:italic;font-size:20px;color:var(--engrave)}
.seal{width:64px;height:64px;flex:none;border-radius:50%;border:2px solid var(--seal);color:var(--seal);display:grid;place-items:center;font-family:var(--serif);font-weight:700;font-size:13px;text-align:center;line-height:1.1;transform:rotate(-12deg)}
.row{display:flex;align-items:baseline;gap:12px;border-bottom:1px solid var(--ink-soft);padding-bottom:6px;margin-bottom:22px;flex-wrap:wrap}
.row .k{font-size:14px;color:var(--ink-soft);white-space:nowrap}
.row .v{font-family:var(--serif);font-size:28px;font-weight:500}
.amount-box{display:flex;align-items:center;gap:10px;background:var(--field);border:1px solid var(--line);border-radius:8px;padding:6px 12px;flex:1;min-width:200px}
.amount-box span{font-family:var(--serif);font-size:28px;color:var(--ink-soft)}
.amount-box input{border:0;background:transparent;font-family:var(--serif);font-size:32px;font-weight:700;color:var(--ink);width:100%;min-width:0}
.amount-box input:focus{outline:none}
.amount-box:focus-within{outline:2px solid var(--seal);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:15px;font-weight:600;color:var(--engrave);background:transparent;border:1px solid var(--engrave);border-radius:999px;padding:7px 14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--engrave);color:var(--paper)}
.micr{margin-top:24px;font-family:"OCR A Std","Courier New",monospace;font-size:13px;letter-spacing:.2em;color:var(--ink-soft)}

/* progress */
.progress{margin:40px 0 8px}
.bar{height:10px;border-radius:5px;background:var(--paper-2);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--seal);min-width:3px}
.progress p{display:flex;justify-content:space-between;gap:12px;margin:8px 0 0;font-size:14px;color:var(--ink-soft);flex-wrap:wrap}

/* methods */
h2{font-family:var(--serif);font-weight:700;font-size:34px;line-height:1.1;margin:48px 0 8px;color:var(--engrave)}
h3{font-size:15px;font-weight:700;margin:28px 0 10px;color:var(--ink-soft)}
.methods{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.m{display:flex;align-items:center;justify-content:space-between;gap:10px;text-decoration:none;background:var(--field);border:1px solid var(--line);border-radius:10px;padding:14px 16px;font-weight:600;cursor:pointer;font:inherit;font-weight:600;color:var(--ink);text-align:start;width:100%}
.m:hover{border-color:var(--engrave)}
.m small{font-weight:400;color:var(--ink-soft);font-size:13px}
.m.off{opacity:.55}
.addr{grid-column:1/-1;display:flex;gap:10px;align-items:center;background:var(--field);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
.addr b{white-space:nowrap}
.addr code{flex:1;overflow-x:auto;white-space:nowrap;font-size:13px;color:var(--ink-soft)}
.addr button{font:inherit;font-size:14px;font-weight:600;background:var(--engrave);color:var(--paper);border:0;border-radius:8px;padding:7px 12px;cursor:pointer;white-space:nowrap}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
footer{margin-top:56px;font-size:13px;color:var(--ink-soft);max-width:44em}
[dir="rtl"] .seal{transform:rotate(12deg)}
@media (max-width:520px){.cheque{padding:22px 18px}.seal{width:52px;height:52px;font-size:11px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <label for="lang" data-i="lang">Language</label>
    <select id="lang"></select>
  </div>

  <h1 data-i="title">Make me a billionaire</h1>
  <p class="sub" data-i="sub"></p>
  <p class="story" data-i="story"></p>

  <section class="cheque" aria-labelledby="payto">
    <div class="cheque-head">
      <div class="bankname" id="bankname"></div>
      <div class="seal" aria-hidden="true">1 000<br>000 000</div>
    </div>
    <div class="row"><span class="k" id="payto" data-i="payTo"></span><span class="v" id="owner"></span></div>
    <div class="row" style="border:0;margin-bottom:12px">
      <label class="k" for="amt" data-i="amount"></label>
      <div class="amount-box"><span id="cur"></span><input id="amt" inputmode="decimal" autocomplete="off"></div>
    </div>
    <div class="chips" id="chips"></div>
    <div class="micr" aria-hidden="true">⑈ 000000001 ⑆ 1000000000 ⑈</div>
  </section>

  <div class="progress" id="progress">
    <div class="bar"><i id="barfill"></i></div>
    <p><span><span data-i="raised"></span>: <b id="raised"></b></span><span><span data-i="goal"></span>: <b id="goal"></b></span></p>
  </div>

  <h2 data-i="choose"></h2>
  <div id="groups"></div>

  <footer data-i="note"></footer>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

};

/* region → currency */
const EUR = "AT BE CY DE EE ES FI FR GR HR IE IT LT LU LV MT NL PT SI SK".split(" ");
const CUR_BY_REGION = {US:"USD",GB:"GBP",RU:"RUB",UA:"UAH",TR:"TRY",IN:"INR",CN:"CNY",JP:"JPY",BR:"BRL",MX:"MXN",CA:"CAD",AU:"AUD",CH:"CHF",PL:"PLN",SE:"SEK",NO:"NOK",AE:"AED",SA:"SAR",IL:"ILS",KZ:"KZT",GE:"GEL",AM:"AMD"};
EUR.forEach(r=>CUR_BY_REGION[r]="EUR");
const LANG_CUR = {ru:"RUB",uk:"UAH",el:"EUR",de:"EUR",fr:"EUR",tr:"TRY",hi:"INR",zh:"CNY",pt:"BRL",es:"EUR",ar:"AED"};
/* rough multipliers so presets feel natural in each currency */
const SCALE = {USD:1,EUR:1,GBP:1,CHF:1,CAD:1,AUD:1,RUB:100,UAH:40,TRY:30,INR:80,CNY:7,JPY:150,BRL:5,MXN:20,PLN:4,SEK:10,NOK:10,AED:4,SAR:4,ILS:4,KZT:500,GEL:3,AMD:400};

const $ = id => document.getElementById(id);
const store = { get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}} };

function detect(){
  const hash = (location.hash||"").slice(1).toLowerCase();
  if (T[hash]) return hash;
  const saved = store.get("mmab-lang"); if (saved && T[saved]) return saved;
  for (const l of (navigator.languages||[navigator.language||"en"])) { const b=l.toLowerCase().split("-")[0]; if (T[b]) return b; }
  return "en";
}
function detectCurrency(lang){
  for (const l of (navigator.languages||[navigator.language||""])) { const r=(l.split("-")[1]||"").toUpperCase(); if (CUR_BY_REGION[r]) return CUR_BY_REGION[r]; }
  const tz = (Intl.DateTimeFormat().resolvedOptions().timeZone||"");
  if (tz==="Asia/Nicosia"||tz.startsWith("Europe/")) return "EUR";
  return LANG_CUR[lang]||"USD";
}

let lang = detect(), currency = detectCurrency(lang), amount = 0;
const presets = () => [5,50,500,5000,1000000].map(v=>v*(SCALE[currency]||1));
const fmt = (v,cur=currency) => new Intl.NumberFormat(lang,{style:"currency",currency:cur,maximumFractionDigits:0}).format(v);
const sym = () => (new Intl.NumberFormat(lang,{style:"currency",currency}).formatToParts(0).find(p=>p.type==="currency")||{}).value||currency;

function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("show"),1800); }

function render(){
  const L = T[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir = lang==="ar" ? "rtl" : "ltr";
  document.title = L.title;
  document.querySelectorAll("[data-i]").forEach(el=>{ el.textContent = L[el.dataset.i]; });
  $("bankname").textContent = L.bank_n;
  $("owner").textContent = CONFIG.owner;
  $("cur").textContent = sym();

  const chips = $("chips"); chips.innerHTML="";
  presets().forEach(v=>{
    const b=document.createElement("button"); b.className="chip"; b.type="button";
    b.textContent=fmt(v); b.setAttribute("aria-pressed", String(v===amount));
    b.onclick=()=>{ amount=v; $("amt").value=v; render(); };
    chips.appendChild(b);
  });

  $("raised").textContent = fmt(CONFIG.raisedUSD,"USD");
  $("goal").textContent = fmt(CONFIG.goalUSD,"USD");
  $("barfill").style.width = Math.min(100, CONFIG.raisedUSD/CONFIG.goalUSD*100)+"%";

  const groups = $("groups"); groups.innerHTML="";
  ["cards","platforms","bank","crypto"].forEach(g=>{
    const items = CONFIG.methods.filter(m=>m.group===g && (CONFIG.demo || m.url || m.value));
    if (!items.length) return;
    const h=document.createElement("h3"); h.textContent=L[g]; groups.appendChild(h);
    const grid=document.createElement("div"); grid.className="methods"; groups.appendChild(grid);
    items.forEach(m=>{
      const ready = !!(m.url||m.value);
      if (m.copy){
        const row=document.createElement("div"); row.className="addr"+(ready?"":" m off");
        row.innerHTML=`<b></b><code></code><button type="button"></button>`;
        row.querySelector("b").textContent=m.name;
        row.querySelector("code").textContent=m.value||"—";
        const btn=row.querySelector("button"); btn.textContent=L.copy;
        btn.onclick=async()=>{ if(!ready) return toast(L.soon); try{await navigator.clipboard.writeText(m.value);}catch(e){} toast(L.copied); };
        grid.appendChild(row);
      } else {
        const a=document.createElement("a"); a.className="m"+(ready?"":" off");
        a.innerHTML=`<span></span><small></small>`;
        a.querySelector("span").textContent=m.name;
        if (ready){
          let href=m.url;
          if (m.paypalme && amount>0) href=m.url.replace(/\/$/,"")+"/"+amount+currency;
          a.href=href; a.target="_blank"; a.rel="noopener";
          a.querySelector("small").textContent = (m.paypalme && amount>0) ? fmt(amount) : "";
        } else {
          a.href="#"; a.onclick=e=>{e.preventDefault();toast(L.soon)};
          a.querySelector("small").textContent="—";
        }
        grid.appendChild(a);
      }
    });
  });
}

/* language select */
const sel=$("lang");
Object.keys(T).forEach(k=>{ const o=document.createElement("option"); o.value=k; o.textContent=T[k].n; sel.appendChild(o); });
sel.value=lang;
sel.onchange=()=>{ lang=sel.value; store.set("mmab-lang",lang); render(); };
window.addEventListener("hashchange",()=>{ const h=location.hash.slice(1).toLowerCase(); if(T[h]){lang=h;sel.value=h;render();} });

$("amt").addEventListener("input",e=>{
  const v=parseFloat(e.target.value.replace(/[^\d.,]/g,"").replace(",","."));
  amount = isFinite(v)&&v>0 ? Math.round(v*100)/100 : 0;
  render(); $("amt").focus();
});

render();
</script>
</body>
</html>
